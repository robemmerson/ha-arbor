name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: pip install "bandit[toml]==1.7.10"

      - name: Run Bandit
        run: bandit -r custom_components/ -c pyproject.toml

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Extract requirements from manifest
        run: |
          python - <<'PY'
          import json
          with open("custom_components/arbor/manifest.json") as f:
              manifest = json.load(f)
          reqs = manifest.get("requirements", [])
          with open("ci-requirements.txt", "w") as f:
              f.write("\n".join(reqs) + "\n")
          print("Wrote ci-requirements.txt:")
          print(open("ci-requirements.txt").read())
          PY

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@fb241f581674a1bb995061d62504857a9ea4b69e  # main
        with:
          inputs: ci-requirements.txt

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f  # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  action-pins:
    name: action-pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # Confirms every action is SHA-pinned *and* that its trailing version
      # comment names the tag that SHA really is. Dependabot rewrites those
      # comments by substring substitution, so a comment that has drifted out
      # of sync gets mangled rather than corrected on the next bump.
      - name: Check action pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_action_pins.py
