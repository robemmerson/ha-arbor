name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.2.2

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@d05c25388490cd662baef8495e1bc764c3386153 # master (2026-04-19)

  hacs:
    name: hacs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.2.2

      - name: Run HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main (2026-04-19)
        with:
          category: integration
          # Brand icons ship locally under custom_components/arbor/brand/ via
          # the HA 2026.3 bundled-brands mechanism
          # (https://developers.home-assistant.io/blog/2026/02/24/brands-proxy-api/).
          # home-assistant/brands no longer accepts PRs for custom integrations,
          # so the HACS CDN-backed brands check cannot pass; keep it ignored.
          ignore: brands
